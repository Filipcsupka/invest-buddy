# Local proof stack: Postgres, migrations, web, and the daily scoring job.
# Usage: docker compose up -d --build db migrate web ; docker compose run --rm daily
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: investbuddy
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: investbuddy
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investbuddy"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]

  migrate:
    build: { context: ., target: build }
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgresql://investbuddy:local-only@db:5432/investbuddy
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    environment:
      INGEST_TOKEN: local-dev-token
      DATABASE_URL: postgresql://investbuddy:local-only@db:5432/investbuddy
      DATA_MODE: db
    build: { context: ., target: runtime }
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  daily:
    build: { context: ., target: runtime }
    command: ["node", "dist/jobs/daily.js"]
    environment:
      DATA_MODE: db
      DATABASE_URL: postgresql://investbuddy:local-only@db:5432/investbuddy
    depends_on:
      migrate: { condition: service_completed_successfully }
    profiles: ["jobs"]

  reconcile:
    build: { context: ., target: runtime }
    command: ["node", "dist/jobs/reconcile.js"]
    environment:
      DATABASE_URL: postgresql://investbuddy:local-only@db:5432/investbuddy
      RECONCILE_VERIFY: ${RECONCILE_VERIFY:-live}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    profiles: ["jobs"]

volumes:
  pgdata:
