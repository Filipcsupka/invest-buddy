# Weekly index metadata and current constituents; 25 indices at 10 calls each (250 calls a week).
# Proposal for the infra repo; starts suspended like every proposed job until the EODHD licence is confirmed.
# Supersedes invest-buddy-eodhd-index-components (markets-cronjob.yaml): retire that job when enabling this one.
# They cannot double-fetch (this job also updates index_component_refresh, so the 28-day job skips), but one is enough.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-eodhd-index-fundamentals
  namespace: invest
spec:
  suspend: true
  schedule: "15 3 * * 6"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: invest-buddy
            app.kubernetes.io/component: eodhd-index-fundamentals
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: eodhd-index-fundamentals
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/eodhd-index-fundamentals.js"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: EODHD_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-eodhd
                      key: api-key
                - name: INDEX_FUNDAMENTALS_MAX_CALLS
                  value: "250"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
