apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-digest
  namespace: invest
spec:
  suspend: false
  schedule: "30 7 * * 2-6"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
