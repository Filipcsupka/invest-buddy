apiVersion: v1
kind: ConfigMap
metadata:
  name: invest-buddy-reconcile-config
  namespace: invest
data:
  SEC_USER_AGENT: "InvestBuddy Filip Csupka devopssro@gmail.com"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-prices
  namespace: invest
spec:
  schedule: "30 0 * * 2-6"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1500
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prices
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/prices.js"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: TWELVE_DATA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-market-secrets
                      key: TWELVE_DATA_API_KEY
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 384Mi
          volumes:
            - name: tmp
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-reconcile
  namespace: invest
spec:
  suspend: false
  # After macro (04:00, latest end 04:09) and before daily (04:25).
  schedule: "10 4 * * 2-6"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/reconcile.js"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: SEC_USER_AGENT
                  valueFrom:
                    configMapKeyRef:
                      name: invest-buddy-reconcile-config
                      key: SEC_USER_AGENT
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: tmp
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-daily
  namespace: invest
spec:
  suspend: false
  # Scores what reconcile and extract produce. After reconcile (04:10, latest end 04:25).
  # Its latest end is 05:30, before judge.
  schedule: "25 4 * * 2-6"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: daily
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/daily.js"]
              env:
                - name: DATA_MODE
                  value: db
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: tmp
              emptyDir: {}
---
