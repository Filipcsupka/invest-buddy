apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-eodhd-universe-seed
  namespace: invest
spec:
  suspend: true
  schedule: "0 2 * * 0"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: invest-buddy
            app.kubernetes.io/component: eodhd-universe-seed
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: eodhd-universe-seed
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/eodhd-universe-seed.js", "--top-per-exchange", "75", "--max-calls", "19000"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: EODHD_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-eodhd
                      key: api-key
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
