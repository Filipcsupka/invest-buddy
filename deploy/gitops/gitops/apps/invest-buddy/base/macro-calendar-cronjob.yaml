apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-macro-calendar
  namespace: invest
spec:
  # Enabled by the owner 2026-10-19 after migration 090 and a manual run (44 dates).
  suspend: false
  # Three BLS schedule pages and the Fed calendar file, no metered API. 03:20 is before the 05:30 judge that reads macro_events.
  schedule: "20 3 * * 2-6"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # The schedule changes rarely; the next day is the retry.
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: macro-calendar
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/macro-calendar.js"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                # bls.gov refuses requests without a contact address in the User-Agent.
                - name: SEC_USER_AGENT
                  valueFrom:
                    configMapKeyRef:
                      name: invest-buddy-reconcile-config
                      key: SEC_USER_AGENT
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
