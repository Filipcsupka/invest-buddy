apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-master-refresh
  namespace: invest
spec:
  # D10: weekly security master refresh (CIK, SIC from SEC). Sunday, outside the Tue-Sat nightly chain. Enable after owner approval.
  suspend: true
  schedule: "0 5 * * 0"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: master-refresh
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/master-refresh.js"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: SEC_USER_AGENT
                  valueFrom:
                    configMapKeyRef:
                      name: invest-buddy-reconcile-config
                      key: SEC_USER_AGENT
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 512Mi
