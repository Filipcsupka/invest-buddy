apiVersion: apps/v1
kind: Deployment
metadata:
  name: invest-buddy-web
  namespace: invest
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: invest-buddy-web
  template:
    metadata:
      labels:
        app: invest-buddy-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: migrate
          image: ghcr.io/filipcsupka/invest-buddy:latest
          command: ["npm", "run", "migrate"]
          env:
            - name: NPM_CONFIG_CACHE
              value: /tmp/npm
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: invest-buddy-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      containers:
        - name: web
          image: ghcr.io/filipcsupka/invest-buddy:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATA_MODE
              value: db
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: invest-buddy-secrets
                  key: DATABASE_URL
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: invest-buddy-secrets
                  key: INGEST_TOKEN
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: invest-buddy-web
  namespace: invest
spec:
  selector:
    app: invest-buddy-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: invest
spec:
  selector:
    app: invest-buddy-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
