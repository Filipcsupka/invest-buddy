apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-weekly
  namespace: invest
spec:
  # AL2: weekly Telegram summary, Sunday evening. Enable after owner approval.
  suspend: true
  schedule: "0 18 * * 0"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: weekly
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/weekly.js"]
              env:
                - name: DATA_MODE
                  value: db
                - name: DIGEST_LOCALE
                  value: sk
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-telegram
                      key: TELEGRAM_BOT_TOKEN
                      optional: true
                - name: TELEGRAM_CHAT_ID
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-telegram
                      key: TELEGRAM_CHAT_ID
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 384Mi
          volumes:
            - name: tmp
              emptyDir: {}
