apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-watchdog
  namespace: invest
spec:
  # PL27: reads job_runs and sends an alert for a missed job, stale data, a full volume, or an expiring certificate. Alerts go to the owner private chat (secret invest-buddy-telegram-owner). Weekday run. Enable after owner approval, both Telegram secrets (invest-buddy-telegram and invest-buddy-telegram-owner) and migrations 080 and 081.
  suspend: true
  schedule: "45 7 * * 1-5"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/watchdog.js"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: PG_PVC_BYTES
                  value: "5368709120"
                - name: WATCHDOG_TLS_HOSTS
                  value: invest.filipcsupka.online:443
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-telegram
                      key: TELEGRAM_BOT_TOKEN
                - name: TELEGRAM_OWNER_CHAT_ID
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-telegram-owner
                      key: TELEGRAM_OWNER_CHAT_ID
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 384Mi
---
