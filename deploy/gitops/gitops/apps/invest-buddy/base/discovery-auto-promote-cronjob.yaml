apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-discovery-auto-promote
  namespace: invest
spec:
  # Owner decision 2026-10-20: nothing runs by hand. Promotes pending discovery candidates (Watch or better, last 3 weeks) into the universe,
  # at most 2 a run and 6 a week (defaults in the job), best rule score first. Each promotion adds collect, extract and judge cost. Needs SEC for the CIK and SIC seed.
  # 14:30 daily, after pool-bars (ends by 14:10); the new name is collected from the next 01:00 chain.
  suspend: false
  schedule: "30 14 * * *"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: discovery-auto-promote
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/discovery-auto-promote.js"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: SEC_USER_AGENT
                  valueFrom:
                    configMapKeyRef:
                      name: invest-buddy-reconcile-config
                      key: SEC_USER_AGENT
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 512Mi
