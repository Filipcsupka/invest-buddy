apiVersion: v1
kind: ConfigMap
metadata:
  name: invest-buddy-research-config
  namespace: invest
data:
  # Owner decision 2026-10-19: research runs on schedule. Notify runs daily; it sends nothing until the owner Telegram secret exists (optional ref).
  RESEARCH_ENABLED: "on"
  AI_DAILY_TOKEN_CEILING: "2400000"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-research-weekly
  namespace: invest
spec:
  suspend: false
  schedule: "0 1 * * 0"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 2400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: invest-buddy
            app.kubernetes.io/component: research-weekly
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: research-weekly
              image: ghcr.io/filipcsupka/invest-buddy-scanner:latest
              command: ["/bin/sh", "-ec"]
              args:
                - 'exec node /app/scanner/run-research.mjs --type weekly --timeout-s 700'
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: RESEARCH_ENABLED
                  valueFrom:
                    configMapKeyRef:
                      name: invest-buddy-research-config
                      key: RESEARCH_ENABLED
                - name: INGEST_BASE_URL
                  value: http://web.invest.svc.cluster.local:3000
                - name: INGEST_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: INGEST_TOKEN
                - name: CLAUDE_CODE_OAUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-scanner-secrets
                      key: CLAUDE_CODE_OAUTH_TOKEN
                - name: CODEX_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-codex-token
                      key: CODEX_ACCESS_TOKEN
                      optional: true
                - name: RESEARCH_FALLBACK_ADAPTER
                  value: codex
                - name: RESEARCH_CODEX_QUOTA_UNKNOWN
                  value: allow
                - name: RESEARCH_CODEX_DAILY_CALLS
                  value: "3"
                - name: RESEARCH_DAILY_TOKENS
                  value: "1500000"
                - name: RESEARCH_MONTHLY_TOKENS
                  value: "20000000"
                - name: AI_DAILY_TOKEN_CEILING
                  valueFrom:
                    configMapKeyRef:
                      name: invest-buddy-research-config
                      key: AI_DAILY_TOKEN_CEILING
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: scanner-home
                  mountPath: /home/scanner
                - name: scan-out
                  mountPath: /app/scanner/out
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "2"
                  memory: 1Gi
          volumes:
            - name: tmp
              emptyDir: {}
            - name: scanner-home
              emptyDir: {}
            - name: scan-out
              emptyDir: {}
---
