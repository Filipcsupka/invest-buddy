# Market views (indices, forex, crypto, screener, market cap). Proposal for the infra repo: every job starts suspended.
# The windows avoid the 04:00-04:25 scoring chain and the existing EODHD jobs (fundamentals 02:30, insider 02:45, catalyst 06:45).
# Index bars after the US close, Tuesday to Saturday. 25 symbols, 1 call each; each run re-reads the last stored day.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-eodhd-market-bars-index
  namespace: invest
spec:
  suspend: true
  schedule: "20 0 * * 2-6"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: invest-buddy
            app.kubernetes.io/component: eodhd-market-bars-index
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: eodhd-market-bars-index
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/eodhd-market-bars.js", "--class", "index"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: EODHD_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-eodhd
                      key: api-key
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
