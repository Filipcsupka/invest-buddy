apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-collect
  namespace: invest
spec:
  suspend: false
  # After prices (00:30 Tue-Sat, latest end 01:00). Ends by 01:35 before detect.
  schedule: "0 1 * * 2-6"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A failed or locked-out run must not retry at once into SEC's rate limit; the next scheduled run is the retry.
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collect
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/collect.js"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: SEC_USER_AGENT
                  valueFrom:
                    configMapKeyRef:
                      name: invest-buddy-reconcile-config
                      key: SEC_USER_AGENT
                - name: FRED_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-source-keys
                      key: FRED_API_KEY
                      optional: true
                - name: ALPHA_VANTAGE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-source-keys
                      key: ALPHA_VANTAGE_API_KEY
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-collect-alphavantage
  namespace: invest
spec:
  suspend: false
  # Weekly EPS surprise from Alpha Vantage EARNINGS. Free key: 25 requests a day; the source stops at 20 per run and per UTC day.
  # Saturday 08:00 is a separate weekly source refresh after the weekday chain.
  schedule: "0 8 * * 6"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A retry would spend more of the daily quota; the next weekly run is the retry.
      backoffLimit: 0
      # 20 requests 12 s apart take about 4 minutes.
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collect
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/collect.js"]
              args: ["--source", "alphavantage"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: ALPHA_VANTAGE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-source-keys
                      key: ALPHA_VANTAGE_API_KEY
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-detect
  namespace: invest
spec:
  suspend: false
  # After collect's latest end (01:35) and before extract (01:50).
  schedule: "35 1 * * 2-6"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: detect
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/detect.js"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 384Mi
---
