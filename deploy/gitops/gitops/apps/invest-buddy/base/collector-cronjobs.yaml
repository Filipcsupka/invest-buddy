apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-discovery
  namespace: invest
spec:
  suspend: false
  # Weekly, Saturday after collect-alphavantage (08:00). Finds new tickers outside the universe, scores them with the same rules and stores candidates; promoted ones enter the universe for the next weekday chain.
  schedule: "30 9 * * 6"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: discovery
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/discovery.js"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: SEC_USER_AGENT
                  valueFrom:
                    configMapKeyRef:
                      name: invest-buddy-reconcile-config
                      key: SEC_USER_AGENT
                - name: TWELVE_DATA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-market-secrets
                      key: TWELVE_DATA_API_KEY
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 512Mi
---
