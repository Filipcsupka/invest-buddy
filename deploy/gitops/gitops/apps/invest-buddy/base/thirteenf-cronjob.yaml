apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-thirteenf-q3
  namespace: invest
spec:
  # D22: enable after migration 050 and owner approval. Q3 13F deadline is mid-November; run once on 2026-11-20 (or run a manual Job with --dry-run first).
  # A CronJob cannot be pinned to one year, so suspend it again after the run.
  suspend: true
  schedule: "0 8 20 11 *"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: thirteenf-q3
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/thirteenf.js"]
              args: []
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: SEC_USER_AGENT
                  valueFrom:
                    configMapKeyRef:
                      name: invest-buddy-reconcile-config
                      key: SEC_USER_AGENT
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: 300m
                  memory: 1Gi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
---
