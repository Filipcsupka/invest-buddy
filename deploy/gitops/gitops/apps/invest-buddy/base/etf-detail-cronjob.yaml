# ETF daily bars, Tuesday to Saturday after the stock jobs and before etf-score (03:30): one bulk EOD request per large exchange.
# History backfill is a manual mode. EODHD_ACCOUNT_DAILY_BUDGET stops each run before eodhd_call_log reaches it for the day.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-eodhd-etf
  namespace: invest
spec:
  suspend: false
  schedule: "35 2 * * 2-6"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: invest-buddy
            app.kubernetes.io/component: eodhd-etf
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: eodhd-etf
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/eodhd-etf.js", "--mode", "bars"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: ETF_EODHD_MAX_CALLS
                  value: "10000"
                - name: EODHD_ACCOUNT_DAILY_BUDGET
                  value: "70000"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: EODHD_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-eodhd
                      key: api-key
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi

