name: Build
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:jobs
      - run: test -f dist/jobs/reconcile.js && test -f dist/jobs/collect.js && test -f dist/jobs/detect.js && test -f dist/jobs/retention.js

  image:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tag
        id: image
        run: |
          echo "tag=ghcr.io/filipcsupka/invest-buddy:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "scanner_tag=ghcr.io/filipcsupka/invest-buddy-scanner:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image.outputs.tag }}
      - name: Build and publish scanner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: scanner/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image.outputs.scanner_tag }}

  deploy-gitops:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.INFRA_BUMP == 'true'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check infra token
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: test -n "$INFRA_REPO_TOKEN"
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2
        with:
          kustomize-version: "5.4.3"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Filipcsupka/infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app
          persist-credentials: false
      - name: Require scanner image source
        run: test -f app/scanner/Dockerfile
      - name: Pin image in infra overlay
        working-directory: infra/gitops/apps/invest-buddy/overlays/prod
        run: |
          kustomize edit set image \
            "ghcr.io/filipcsupka/invest-buddy=ghcr.io/filipcsupka/invest-buddy:sha-${GITHUB_SHA::7}" \
            "ghcr.io/filipcsupka/invest-buddy-scanner=ghcr.io/filipcsupka/invest-buddy-scanner:sha-${GITHUB_SHA::7}"
      - name: Commit image pin
        working-directory: infra
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/invest-buddy/overlays/prod/kustomization.yaml
          git commit -m "Pin invest-buddy sha-${GITHUB_SHA::7}"
          git push
