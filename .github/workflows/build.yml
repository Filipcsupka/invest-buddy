name: Build
on:
  pull_request:
    paths-ignore: &docs_only
      # docs/design is not ignored: src/i18n/status-copy.test.ts reads docs/design/status-slider.md.
      - "docs/*"
      - "docs/roadmap/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main]
    paths-ignore: *docs_only
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TEST_DATABASE_URL: postgresql://investbuddy:investbuddy@localhost:5432/investbuddy_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # PostgreSQL 16 is preinstalled on the ubuntu runner image, so no Docker Hub pull.
      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 && break
            sleep 2
          done
          pg_isready -h localhost -p 5432
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER investbuddy WITH SUPERUSER PASSWORD 'investbuddy'" -c "CREATE DATABASE investbuddy_test OWNER investbuddy"
          PGPASSWORD=investbuddy psql -h localhost -U investbuddy -d investbuddy_test -tAc "select version()"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - name: Migration lint
        if: github.event_name == 'pull_request'
        run: npm run migration:lint
      - run: npm run migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm test
      - run: npm run build
      - run: npm run build:jobs
      - run: test -f dist/jobs/reconcile.js && test -f dist/jobs/collect.js && test -f dist/jobs/detect.js && test -f dist/jobs/retention.js
      - run: npm audit --omit=dev --audit-level=high
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2
        with:
          kustomize-version: "5.4.3"
      - name: Render and validate Kubernetes manifests
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            --output /tmp/kubeconform.tar.gz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tar.gz' | sha256sum --check
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          kustomize build deploy/gitops/gitops/apps/invest-buddy/overlays/prod | /tmp/kubeconform -strict -summary -ignore-missing-schemas

  e2e:
    # Browser smoke tests against the standalone build in fixture mode (no database).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    # Pull requests only, and only when image inputs change. Build check, no push, no scan.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check changed files
        id: changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -Eq '^(Dockerfile|scanner/Dockerfile|package\.json|package-lock\.json|deploy/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No image inputs changed, skipping image build."
          fi
      - if: steps.changed.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.changed.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3
      - name: Build web image
        if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Build scanner image
        if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: scanner/Dockerfile
          push: false
          cache-from: type=gha,scope=scanner
          cache-to: type=gha,scope=scanner,mode=max

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, e2e, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags
        id: image
        run: |
          echo "tag=ghcr.io/filipcsupka/invest-buddy:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "scanner_tag=ghcr.io/filipcsupka/invest-buddy-scanner:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Publish web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ghcr.io/filipcsupka/invest-buddy:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          sbom: true
          provenance: mode=max
      - name: Publish scanner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: scanner/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.scanner_tag }}
            ghcr.io/filipcsupka/invest-buddy-scanner:latest
          cache-from: type=gha,scope=scanner
          cache-to: type=gha,scope=scanner,mode=max
          sbom: true
          provenance: mode=max

  deploy-gitops:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.INFRA_BUMP == 'true'
    concurrency:
      group: deploy-gitops
      cancel-in-progress: false
    needs: [publish-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check infra token
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: test -n "$INFRA_REPO_TOKEN"
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2
        with:
          kustomize-version: "5.4.3"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Filipcsupka/infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
      - name: Require scanner image source
        run: test -f app/scanner/Dockerfile
      - name: Pin image in infra overlay
        working-directory: infra/gitops/apps/invest-buddy/overlays/prod
        run: |
          kustomize edit set image \
            "ghcr.io/filipcsupka/invest-buddy=ghcr.io/filipcsupka/invest-buddy:sha-${GITHUB_SHA::7}" \
            "ghcr.io/filipcsupka/invest-buddy-scanner=ghcr.io/filipcsupka/invest-buddy-scanner:sha-${GITHUB_SHA::7}"
      - name: Commit image pin
        working-directory: infra
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/invest-buddy/overlays/prod/kustomization.yaml
          git commit -m "Pin invest-buddy sha-${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push
