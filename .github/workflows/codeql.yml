name: CodeQL
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  analyze:
    # Code scanning on a private repository needs GitHub Advanced Security. Set repository variable GHAS_ENABLED=true after enabling it.
    if: vars.GHAS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
